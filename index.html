<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Наши 6 месяцев ♡</title>
<style>
:root {
  --rose: #c97891;
  --deep: #99536f;
  --ink: #674454;
}
* {
  box-sizing: border-box;
  font-family: "Times New Roman", Times, serif;
}
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  overflow-x: hidden;
  padding: 24px;
  color: var(--ink);
  background:
    radial-gradient(circle at 15% 20%, #ffffffcc, transparent 28%),
    radial-gradient(circle at 85% 80%, #ce8ba13d, transparent 30%),
    linear-gradient(135deg, #f4dce3, #ead0dc 48%, #f8e9e9);
}
/* Декоративные элементы */
.sparkle {
  position: fixed;
  color: #99536f55;
  pointer-events: none;
  animation: float 7s ease-in-out infinite;
}
.sparkle:nth-child(1) {
  top: 12%;
  left: 12%;
  font-size: 25px;
}
.sparkle:nth-child(2) {
  top: 22%;
  right: 13%;
  font-size: 18px;
  animation-delay: -2s;
}
.sparkle:nth-child(3) {
  bottom: 15%;
  left: 18%;
  font-size: 20px;
  animation-delay: -4s;
}
.sparkle:nth-child(4) {
  bottom: 20%;
  right: 16%;
  font-size: 28px;
  animation-delay: -1s;
}
@keyframes float {
  0%,100% {
    transform: translateY(0) rotate(0);
    opacity: .45;
  }
  50% {
    transform: translateY(-15px) rotate(12deg);
    opacity: .9;
  }
}
/* Приветственное окно */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 5;
  display: grid;
  place-items: center;
  padding: 22px;
  background: #5330414d;
  backdrop-filter: blur(8px);
  transition: opacity .5s, visibility .5s;
}
.overlay.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.welcome {
  width: min(460px, 100%);
  padding: 38px 30px 34px;
  text-align: center;
  border: 1px solid #ffffffcc;
  border-radius: 28px;
  background: linear-gradient(145deg,#fffaf8,#f8e8ed);
  box-shadow: 0 24px 70px #69374d38;
  animation: appear .7s ease both;
}
@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(20px) scale(.96);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}
.heart {
  color: var(--rose);
  font-size: 32px;
  margin-bottom: 14px;
}
.welcome p {
  margin: 0 0 22px;
  font-size: clamp(22px,5vw,29px);
  line-height: 1.45;
}
/* Подарок */
.gift-stage {
  position: relative;
  width: 170px;
  height: 125px;
  margin: 0 auto 15px;
  display: grid;
  place-items: center;
}
.gift-emoji {
  position: relative;
  z-index: 2;
  font-size: 85px;
  line-height: 1;
  display: block;
  filter: drop-shadow(0 9px 8px #a85f7b35);
  transform-origin: center bottom;
}
/* Тряска подарка */
.gift-stage.opening .gift-emoji {
  animation: giftShake .65s ease-in-out,
             giftOpen 1.2s ease-in-out .65s forwards;
}
@keyframes giftShake {
  0%,100% {
    transform: rotate(0) translateX(0);
  }
  15% {
    transform: rotate(-13deg) translateX(-5px);
  }
  30% {
    transform: rotate(13deg) translateX(5px);
  }
  45% {
    transform: rotate(-12deg) translateX(-4px);
  }
  60% {
    transform: rotate(12deg) translateX(4px);
  }
  75% {
    transform: rotate(-7deg);
  }
  90% {
    transform: rotate(6deg);
  }
}
@keyframes giftOpen {
  0% {
    transform: scale(1) rotate(0);
  }
  35% {
    transform: scale(1.35) rotate(-10deg);
  }
  65% {
    transform: scale(1.5) rotate(10deg);
  }
  100% {
    transform: scale(1.35) rotate(0);
    opacity: .35;
  }
}
/* Разлетающиеся ленточки */
.ribbon {
  position: absolute;
  z-index: 3;
  width: 9px;
  height: 38px;
  border-radius: 5px;
  background: linear-gradient(180deg,#f3b6c8,#c97891);
  opacity: 0;
  pointer-events: none;
}
.ribbon:nth-child(2) {
  left: 25px;
  top: 45px;
}
.ribbon:nth-child(3) {
  right: 25px;
  top: 45px;
}
.ribbon:nth-child(4) {
  left: 65px;
  top: 5px;
}
.ribbon:nth-child(5) {
  right: 65px;
  top: 5px;
}
.ribbon:nth-child(6) {
  left: 80px;
  bottom: 0;
}
.gift-stage.opening .ribbon:nth-child(2) {
  animation: ribbonLeft 1.2s ease-out .7s forwards;
}
.gift-stage.opening .ribbon:nth-child(3) {
  animation: ribbonRight 1.2s ease-out .7s forwards;
}
.gift-stage.opening .ribbon:nth-child(4) {
  animation: ribbonTopLeft 1.2s ease-out .7s forwards;
}
.gift-stage.opening .ribbon:nth-child(5) {
  animation: ribbonTopRight 1.2s ease-out .7s forwards;
}
.gift-stage.opening .ribbon:nth-child(6) {
  animation: ribbonBottom 1.2s ease-out .7s forwards;
}
@keyframes ribbonLeft {
  to {
    opacity: 1;
    transform: translate(-65px,-55px) rotate(-65deg) scale(.7);
  }
}
@keyframes ribbonRight {
  to {
    opacity: 1;
    transform: translate(65px,-55px) rotate(65deg) scale(.7);
  }
}
@keyframes ribbonTopLeft {
  to {
    opacity: 1;
    transform: translate(-45px,-65px) rotate(-45deg) scale(.7);
  }
}
@keyframes ribbonTopRight {
  to {
    opacity: 1;
    transform: translate(45px,-65px) rotate(45deg) scale(.7);
  }
}
@keyframes ribbonBottom {
  to {
    opacity: 1;
    transform: translateY(75px) rotate(90deg) scale(.7);
  }
}
/* Блёстки при открытии */
.gift-sparkle {
  position: absolute;
  z-index: 4;
  font-size: 24px;
  color: #c97891;
  opacity: 0;
  pointer-events: none;
}
.gift-sparkle:nth-of-type(7) {
  top: 0;
  left: 0;
}
.gift-sparkle:nth-of-type(8) {
  top: 5px;
  right: 0;
}
.gift-sparkle:nth-of-type(9) {
  bottom: 0;
  left: 10px;
}
.gift-sparkle:nth-of-type(10) {
  bottom: 0;
  right: 10px;
}
.gift-stage.opening .gift-sparkle {
  animation: sparkleBurst 1.4s ease-out .8s forwards;
}
@keyframes sparkleBurst {
  0% {
    opacity: 0;
    transform: scale(.2) rotate(0);
  }
  45% {
    opacity: 1;
    transform: scale(1.5) rotate(90deg);
  }
  100% {
    opacity: 0;
    transform: scale(.5) rotate(180deg) translateY(-20px);
  }
}
/* Кнопки */
button {
  border: 0;
  border-radius: 999px;
  padding: 14px 28px;
  color: white;
  font-family: "Times New Roman", Times, serif;
  font-size: 17px;
  font-weight: 600;
  cursor: pointer;
  background: linear-gradient(135deg,#c97891,#a85f7b);
  box-shadow: 0 9px 22px #a85f7b47;
  transition: .2s;
}
button:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 26px #a85f7b5c;
}
button:disabled {
  cursor: default;
  opacity: .7;
}
/* Блокнот */
.book-wrap {
  width: min(760px,100%);
  opacity: 0;
  transform: translateY(18px) scale(.98);
  transition: opacity .8s, transform .8s;
  pointer-events: none;
}
.book-wrap.visible {
  opacity: 1;
  transform: translateY(0) scale(1);
  pointer-events: auto;
}
.book {
  position: relative;
  min-height: 470px;
  padding: clamp(34px,7vw,66px) clamp(25px,7vw,76px);
  padding-bottom: 55px;
  overflow: hidden;
  border: 1px solid #e8cbd4;
  border-radius: 8px 24px 24px 8px;
  background:
    linear-gradient(
      90deg,
      #b1708921 0,
      #b1708921 2px,
      transparent 2px
    ),
    linear-gradient(105deg,#fffdfa,#fff8f5);
  box-shadow:
    0 28px 70px #69374d38,
    inset 8px 0 14px #91556c14;
}
/* Вертикальная линия */
.book::before {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: 17px;
  width: 1px;
  background: #cc809a52;
}
/* Сердечко на странице */
.book::after {
  content: "♡";
  position: absolute;
  right: 26px;
  top: 18px;
  color: #c9789159;
  font-size: 26px;
}
.eyebrow {
  margin: 0 0 20px;
  color: #b16e88;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 3px;
  text-transform: uppercase;
}
/* Основной текст */
.letter {
  min-height: 220px;
  white-space: pre-wrap;
  font-size: 12px;
  line-height: 1.5;
  text-indent: 0;
  text-align: left;
  color: #674454;
  overflow-wrap: break-word;
}
/* Номер страницы */
.page-number {
  position: absolute;
  bottom: 18px;
  left: 35px;
  color: #b16e88;
  font-size: 15px;
  letter-spacing: 1px;
}
/* Курсор */
.cursor {
  display: inline-block;
  width: 2px;
  height: 1em;
  margin-left: 2px;
  vertical-align: -2px;
  background: #b16e88;
  animation: blink .8s steps(2,start) infinite;
}
@keyframes blink {
  to {
    visibility: hidden;
  }
}
/* Кнопка продолжения */
.continue-btn {
  display: block;
  margin: 25px auto 0;
  opacity: 0;
  pointer-events: none;
  transition: opacity .6s;
}
.continue-btn.visible {
  opacity: 1;
  pointer-events: auto;
}
/* Вторая страница */
.next-screen {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: grid;
  place-items: center;
  padding: 20px;
  background:
    radial-gradient(circle at 15% 20%, #ffffffcc, transparent 28%),
    radial-gradient(circle at 85% 80%, #ce8ba13d, transparent 30%),
    linear-gradient(135deg,#f4dce3,#ead0dc,#f8e9e9);
  opacity: 0;
  visibility: hidden;
  transition: opacity .7s, visibility .7s;
}
.next-screen.visible {
  opacity: 1;
  visibility: visible;
}
.next-content {
  width: min(460px,100%);
  padding: 45px 30px;
  text-align: center;
  border: 1px solid white;
  border-radius: 25px;
  background: linear-gradient(145deg,#fffaf8,#f8e8ed);
  box-shadow: 0 24px 70px #69374d38;
  transform: translateY(20px) scale(.97);
  transition: transform .7s;
}
.next-screen.visible .next-content {
  transform: translateY(0) scale(1);
}
/* QR-код */
.qr-image {
  display: block;
  width: 220px;
  height: 220px;
  max-width: 100%;
  object-fit: contain;
  margin: 0 auto 20px;
  padding: 10px;
  border: 1px solid #efd4dd;
  border-radius: 15px;
  background: white;
  box-shadow: 0 8px 25px #a85f7b30;
}
/* Время */
.next-content .time {
  margin-top: 20px;
  color: #987184;
  font-size: 19px;
  letter-spacing: 2px;
}
/* Кнопка назад */
.back-btn {
  display: block;
  margin: 25px auto 0;
  padding: 12px 30px;
  font-size: 16px;
  background: linear-gradient(135deg, #d18ba2, #a85f7b);
  box-shadow: 0 7px 18px #a85f7b35;
}
.back-btn:hover {
  transform: translateY(-2px);
}
/* Мобильная версия */
@media(max-width:520px) {
  body {
    padding: 16px;
  }
  .book {
    min-height: 500px;
    padding-top: 58px;
  }
  .letter {
    min-height: 250px;
    font-size: 12px;
  }
}
@media(prefers-reduced-motion: reduce) {
  .sparkle {
    animation: none;
  }
}
</style>
</head>
<body>
<!-- Декоративные элементы -->
<span class="sparkle">✧</span>
<span class="sparkle">♡</span>
<span class="sparkle">✦</span>
<span class="sparkle">✧</span>
<!-- Первое окно -->
<div class="overlay" id="welcomeOverlay">
  <div class="welcome">
    <div class="heart">♡</div>
    <p>
      Вот и настали 6 месяцев наших отношений)
    </p>
    <!-- Анимированный подарок -->
    <div class="gift-stage" id="giftStage">
      <span class="gift-emoji">🎁</span>
      <span class="ribbon"></span>
      <span class="ribbon"></span>
      <span class="ribbon"></span>
      <span class="ribbon"></span>
      <span class="ribbon"></span>
      <span class="gift-sparkle">✦</span>
      <span class="gift-sparkle">✧</span>
      <span class="gift-sparkle">♡</span>
      <span class="gift-sparkle">✧</span>
    </div>
    <button id="openGift">
      Открыть подарок
    </button>
  </div>
</div>
<!-- Блокнот -->
<main class="book-wrap" id="bookWrap">
  <article class="book">
    <p class="eyebrow">
      С полугодием нас ❤️
    </p>
    <div class="letter"><span id="typedText"></span><span class="cursor" id="cursor"></span></div>
    <button class="continue-btn" id="continueBtn">
      Продолжить →
    </button>
    <div class="page-number">1</div>
  </article>
</main>
<!-- Вторая страница -->
<div class="next-screen" id="nextScreen">
  <div class="next-content">
    <img
      src="qr.png"
      alt="QR-код"
      class="qr-image"
    >
    <div class="time">
      00:20:46
    </div>
    <button class="back-btn" id="backBtn">
      ← Назад
    </button>
  </div>
</div>
<script>
/* ТВОЙ ТЕКСТ */
const message = `Солнце, прошло уже 6 месяцев. Целых под года мы уже вместе, проводим время, находясь рядом друг с другом, любим и поддерживаем, переживаем и скучаем, и всё это делаем вместе. Впереди жизнь, которую я очень хочу провести с тобой, только с тобой и ни с кем больше. Ты самое важное что у меня есть, самый любимый человек, самая лучшая девочка на всей планете и во всей вселенной. Ты всегда можешь на меня положится, всегда можешь мне доверится. Мы с тобой пройдем многое, много где побываем, я верю в нас. Я люблю тебя моя любимая девочка, и люблю очень сильно❤️`;
/* ПЕРЕМЕННЫЕ */
const overlay = document.getElementById("welcomeOverlay");
const bookWrap = document.getElementById("bookWrap");
const openGift = document.getElementById("openGift");
const giftStage = document.getElementById("giftStage");
const typedText = document.getElementById("typedText");
const cursor = document.getElementById("cursor");
const continueBtn = document.getElementById("continueBtn");
const nextScreen = document.getElementById("nextScreen");
const backBtn = document.getElementById("backBtn");
/* ОТКРЫТИЕ ПОДАРКА */
let giftOpened = false;
openGift.addEventListener("click", () => {
  if (giftOpened) return;
  giftOpened = true;
  // Блокируем повторное нажатие
  openGift.disabled = true;
  openGift.textContent = "Открываем...";
  // Запускаем анимацию подарка
  giftStage.classList.add("opening");
  // Через 2,5 секунды открываем блокнот
  setTimeout(() => {
    overlay.classList.add("hidden");
    bookWrap.classList.add("visible");
    // Начинаем печатать текст
    setTimeout(typeLetter, 650);
  }, 2500);
});
/* АНИМАЦИЯ ПЕЧАТИ */
let index = 0;
function typeLetter() {
  if (index < message.length) {
    typedText.textContent += message[index];
    index++;
    setTimeout(
      typeLetter,
      message[index - 1] === "\n" ? 180 : 38
    );
  } else {
    cursor.style.display = "none";
    continueBtn.classList.add("visible");
  }
}
/* ПЕРЕХОД НА СТРАНИЦУ С QR */
continueBtn.addEventListener("click", () => {
  nextScreen.classList.add("visible");
});
/* ВОЗВРАЩЕНИЕ НАЗАД */
backBtn.addEventListener("click", () => {
  // Закрываем QR-страницу
  nextScreen.classList.remove("visible");
  // Восстанавливаем полностью написанный текст
  typedText.textContent = message;
  // Убираем курсор
  cursor.style.display = "none";
  // Показываем кнопку продолжения
  continueBtn.classList.add("visible");
});
</script>
</body>
</html>
